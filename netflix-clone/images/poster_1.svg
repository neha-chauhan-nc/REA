<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <radialGradient id="vignette-1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.85)"/>
    </radialGradient>
  </defs>
  <rect width="200" height="300" fill="url(#dummy)" style="fill: linear-gradient(135deg, #0d1b2a 0%, #1b263b 40%, #000814 100%)"/>
  <rect width="200" height="300" fill="url(#vignette-1)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="75" x2="200" y2="75" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="150" x2="200" y2="150" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="225" x2="200" y2="225" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Badge -->
  <rect x="12" y="14" width="76" height="18" rx="4" fill="rgba(0,0,0,0.65)" stroke="#00f0ff" stroke-width="1"/>
  <text x="50" y="26" fill="#00f0ff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">SAMPLE</text>

  <!-- Central Artwork Icon -->
  <g transform="translate(0, 5)">
    <polygon points="100,50 140,130 60,130" fill="none" stroke="#00f0ff" stroke-width="6"/>
           <circle cx="100" cy="95" r="16" fill="#ff007f" />
           <line x1="20" y1="180" x2="180" y2="180" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Overlay gradient for title legibility -->
  <rect y="170" width="200" height="130" fill="linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%)"/>

  <!-- Movie Title and Details -->
  <text x="14" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="-0.2">Cyber Odyssey</text>
  <text x="14" y="258" fill="#00f0ff" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Sci-Fi • Cyberpunk</text>
  <text x="14" y="280" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="9">Watch Now • HD</text>
</svg>