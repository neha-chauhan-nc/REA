<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <radialGradient id="vignette-3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.85)"/>
    </radialGradient>
  </defs>
  <rect width="200" height="300" fill="url(#dummy)" style="fill: linear-gradient(135deg, #1f0322 0%, #3a0ca3 50%, #050505 100%)"/>
  <rect width="200" height="300" fill="url(#vignette-3)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="75" x2="200" y2="75" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="150" x2="200" y2="150" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="225" x2="200" y2="225" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Badge -->
  <rect x="12" y="14" width="76" height="18" rx="4" fill="rgba(0,0,0,0.65)" stroke="#f72585" stroke-width="1"/>
  <text x="50" y="26" fill="#f72585" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">SAMPLE</text>

  <!-- Central Artwork Icon -->
  <g transform="translate(0, 5)">
    <path d="M40,140 Q100,70 160,140 L140,150 L60,150 Z" fill="none" stroke="#f72585" stroke-width="6"/>
           <circle cx="65" cy="150" r="12" fill="#4cc9f0"/>
           <circle cx="135" cy="150" r="12" fill="#4cc9f0"/>
  </g>

  <!-- Overlay gradient for title legibility -->
  <rect y="170" width="200" height="130" fill="linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%)"/>

  <!-- Movie Title and Details -->
  <text x="14" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="-0.2">Neon Velocity</text>
  <text x="14" y="258" fill="#f72585" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Action • Supercars</text>
  <text x="14" y="280" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="9">Watch Now • HD</text>
</svg>