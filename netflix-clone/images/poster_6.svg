<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <radialGradient id="vignette-6" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.85)"/>
    </radialGradient>
  </defs>
  <rect width="200" height="300" fill="url(#dummy)" style="fill: linear-gradient(135deg, #28190e 0%, #3e2723 60%, #1a120b 100%)"/>
  <rect width="200" height="300" fill="url(#vignette-6)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="75" x2="200" y2="75" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="150" x2="200" y2="150" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="225" x2="200" y2="225" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Badge -->
  <rect x="12" y="14" width="76" height="18" rx="4" fill="rgba(0,0,0,0.65)" stroke="#e0a96d" stroke-width="1"/>
  <text x="50" y="26" fill="#e0a96d" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">SAMPLE</text>

  <!-- Central Artwork Icon -->
  <g transform="translate(0, 5)">
    <path d="M85,60 L115,60 L115,85 L145,145 A15,15 0 0,1 130,165 L70,165 A15,15 0 0,1 55,145 L85,85 Z" fill="none" stroke="#e0a96d" stroke-width="5"/>
           <circle cx="100" cy="140" r="12" fill="#ffb703" opacity="0.7"/>
  </g>

  <!-- Overlay gradient for title legibility -->
  <rect y="170" width="200" height="130" fill="linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%)"/>

